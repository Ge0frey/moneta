# Every pull request and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint · typecheck · unit tests · gas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Format
        run: pnpm format:check
      - name: Lint (forge fmt, tsc)
        run: pnpm lint
      - name: Generated ABIs and address book are in sync with the contracts
        run: |
          pnpm --filter @moneta/sdk generate
          git diff --exit-code packages/sdk/src/generated packages/sdk/abi-json
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit, fuzz (1k), invariant and scenario tests
        run: pnpm test
      - name: Gas budgets (forge snapshot --check)
        run: pnpm --filter @moneta/contracts gas:check
      - name: Contract sizes (Monad limit 128 KB)
        working-directory: packages/contracts
        run: forge build --sizes

  security:
    name: Static analysis · secrets · dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Slither (fails on High; Medium findings are triaged in docs/security/static-analysis.md)
        working-directory: packages/contracts
        run: |
          pip install --quiet slither-analyzer==0.11.6
          slither . --config-file slither.config.json --fail-high
      - name: Aderyn report
        working-directory: packages/contracts
        run: npx -y @cyfrin/aderyn@0.6.8 . --src src --path-excludes src/local -o aderyn-report.md
      - uses: actions/upload-artifact@v7
        with:
          name: aderyn-report
          path: packages/contracts/aderyn-report.md
      - name: Gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: Production dependency audit (fails on high)
        run: pnpm audit --prod --audit-level high

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Web (next build)
        run: pnpm --filter @moneta/web build
      - name: Bots image
        run: docker build -f apps/bots/Dockerfile -t moneta-bots:ci .
      - name: Indexer image
        run: docker build -f apps/indexer/Dockerfile -t moneta-indexer:ci .

  integration:
    name: Scenario · E2E · indexer parity
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Playwright browser
        run: pnpm --filter @moneta/web exec playwright install --with-deps chromium
      - name: Local chain + deployment
        run: |
          mkdir -p .dev
          anvil --chain-id 31337 --block-time 1 --host 0.0.0.0 --code-size-limit 131072 > .dev/anvil.log 2>&1 &
          for _ in $(seq 1 30); do cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break; sleep 1; done
          pnpm deploy:local
      - name: Headless system scenario (create → launch → PASS → FAIL → redemption)
        run: pnpm scenario --network local
      - name: Browser E2E (Envio dev indexer in Docker, keeper bot, scripted E2E wallet)
        run: bash scripts/e2e.sh
        env:
          CI: "1"
      - name: Indexer ⇄ chain parity
        run: pnpm --filter @moneta/indexer parity local
      - name: Logs and Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-debug
          path: |
            .dev/*.log
            apps/web/playwright-report
            apps/web/test-results
