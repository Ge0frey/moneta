# Contract deployment to Monad testnet. Manual only, behind GitHub Environment approvals:
#   testnet-staging → 1 reviewer · testnet-public → 2 reviewers (configure in repo settings → Environments).
# The deployer key lives only in the environment's secrets; ownership moves to the protocol Safe in the script.
name: Deploy contracts

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [testnet-staging, testnet-public]
        default: testnet-staging

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Contract tests must pass before any deployment
        working-directory: packages/contracts
        run: forge test --no-match-path 'test/fork/*'
      - name: Import deployer into an encrypted keystore (never written in plaintext to disk)
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: cast wallet import moneta-deployer --private-key "$DEPLOYER_PRIVATE_KEY" --unsafe-password "$KEYSTORE_PASSWORD"
      - name: Deploy (idempotent) and hand ownership to the Safe
        env:
          DEPLOYER_ACCOUNT: moneta-deployer
          ETH_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MONAD_TESTNET_RPC_URL: ${{ secrets.MONAD_TESTNET_RPC_URL || 'https://testnet-rpc.monad.xyz' }}
          PROTOCOL_SAFE: ${{ vars.PROTOCOL_SAFE }}
          FEE_RECIPIENT: ${{ vars.FEE_RECIPIENT }}
        run: pnpm deploy:testnet
      - name: Verify on MonadVision (Sourcify) and Monadscan
        env:
          MONADSCAN_API_KEY: ${{ secrets.MONADSCAN_API_KEY }}
          MONAD_TESTNET_RPC_URL: ${{ secrets.MONAD_TESTNET_RPC_URL || 'https://testnet-rpc.monad.xyz' }}
        run: pnpm --filter @moneta/contracts verify:testnet
      - name: Smoke test against the live deployment
        env:
          MONAD_TESTNET_RPC_URL: ${{ secrets.MONAD_TESTNET_RPC_URL || 'https://testnet-rpc.monad.xyz' }}
        run: pnpm --filter @moneta/bots exec tsx src/index.ts check --network testnet
      - name: Open a PR with the new address book (indexer + web redeploy follow its merge)
        uses: peter-evans/create-pull-request@v7
        with:
          branch: deploy/${{ inputs.environment }}-${{ github.run_id }}
          title: "deploy: ${{ inputs.environment }} addresses"
          body: |
            Contract deployment from run ${{ github.run_id }} (${{ inputs.environment }}).
            Merging updates the SDK address book; the indexer regenerates its config from it. Promote the Envio indexer manually after merge.
          add-paths: |
            packages/contracts/deployments/*.json
            packages/sdk/src/generated/*
            packages/sdk/abi-json/*
