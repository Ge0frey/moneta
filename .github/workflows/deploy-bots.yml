# Bots image: every merge to main publishes to GHCR; the platform (Railway/Fly) pulls the new tag.
# Keys (KEEPER_KEY, TRADER_MNEMONIC) are set in the platform's secret store, never here.
name: Deploy bots

on:
  push:
    branches: [main]
    paths:
      - apps/bots/**
      - packages/sdk/**
      - packages/contracts/deployments/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/bots/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/bots:latest
            ghcr.io/${{ github.repository }}/bots:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Roll out on Fly.io (optional)
        if: ${{ vars.FLY_APP_BOTS != '' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -L https://fly.io/install.sh | sh
          ~/.fly/bin/flyctl deploy --app "${{ vars.FLY_APP_BOTS }}" --image ghcr.io/${{ github.repository }}/bots:${{ github.sha }}
